org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true

# Mod Attributes
modId=enderzoology
modName=Ender Zoology
modVersion=21.1.4
modAuthor=Fuzs
modDescription=Vanilla themed monsters to add some difficulty to the game. A remake of Ender Zoo.
modLicense=CC0-1.0
modSourceUrl=https://github.com/Fuzss/enderzoology
